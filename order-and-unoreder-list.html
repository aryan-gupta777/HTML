<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <strong>order list</strong>
    <ol>
        <li>first</li>
        <li>second</li>
        <!-- creating list inside a list-->
        <ol>
          <li>how are you?</li>
        </ol>
        <li>third</li>
    </ol>

    <strong>unorder list</strong>
    <ul>
        <li>hi</li>
        <li>hello</li>
        <ul>
            <li>how are you?</li>
        </ul>
        <li>bye</li>
    </ul>
</body>
</html>
